<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2026년 야유회 투표</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .vote-card {
            border: none;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            background: white;
            margin-bottom: 20px;
        }
        .vote-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-radius: 15px 15px 0 0;
            padding: 30px;
            text-align: center;
        }
        .form-check-input:checked {
            background-color: #764ba2;
            border-color: #764ba2;
        }
        .form-check-label {
            cursor: pointer;
            font-size: 1.1rem;
            width: 100%;
            display: block;
        }
        .form-check {
            padding: 15px;
            border: 1px solid #e9ecef;
            border-radius: 8px;
            margin-bottom: 10px;
            transition: all 0.2s;
        }
        .form-check:hover {
            background-color: #f1f3f5;
            border-color: #764ba2;
        }
    </style>
    
    <!-- ★ 중복 투표 방지 스크립트 추가 -->
    <script>
        // 페이지 로드 시 실행
        window.onload = function() {
            // 쿠키에서 'voted_2026_picnic'이 있는지 확인
            if (document.cookie.indexOf("voted_2026_picnic=yes") >= 0) {
                alert("이미 투표에 참여하셨습니다.\n결과 페이지로 이동하거나, 결과만 확인하실 수 있습니다.");
                
                // 버튼 비활성화 및 텍스트 변경
                const btn = document.getElementById("submitBtn");
                btn.disabled = true;
                btn.innerText = "이미 참여 완료되었습니다 (중복불가)";
                btn.classList.remove("btn-primary");
                btn.classList.add("btn-secondary");

                // 라디오 버튼들도 선택 못하게 비활성화 (선택적)
                const radios = document.querySelectorAll("input[type=radio]");
                radios.forEach(radio => radio.disabled = true);
            }
        };
    </script>
</head>
<body>

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <form action="vote.php" method="POST">
                
                <!-- 헤더 -->
                <div class="vote-card">
                    <div class="vote-header">
                        <h2>📅 2026년 야유회 의견 조사</h2>
                        <p class="mb-0">회원 여러분의 소중한 의견을 들려주세요.</p>
                    </div>
                </div>

                <!-- 질문 1: 날짜 -->
                <div class="vote-card p-4">
                    <h4 class="mb-4 text-primary fw-bold">Q1. 언제가 가장 좋을까요?</h4>
                    <!-- DB의 poll_options id 값과 value가 일치해야 합니다 -->
                    <div class="form-check">
                        <input class="form-check-input" type="radio" name="date_id" id="date1" value="1" required>
                        <label class="form-check-label" for="date1">2월 (겨울의 끝자락)</label>
                    </div>
                    <div class="form-check">
                        <input class="form-check-input" type="radio" name="date_id" id="date2" value="2">
                        <label class="form-check-label" for="date2">3월 (봄의 시작)</label>
                    </div>
                    <div class="form-check">
                        <input class="form-check-input" type="radio" name="date_id" id="date3" value="3">
                        <label class="form-check-label" for="date3">4월 (따뜻한 봄)</label>
                    </div>
                </div>

                <!-- 질문 2: 장소 -->
                <div class="vote-card p-4">
                    <h4 class="mb-4 text-success fw-bold">Q2. 어디로 갈까요?</h4>
                    <div class="form-check">
                        <input class="form-check-input" type="radio" name="place_id" id="place1" value="4" required>
                        <label class="form-check-label" for="place1">⛰️ 금오산</label>
                    </div>
                    <div class="form-check">
                        <input class="form-check-input" type="radio" name="place_id" id="place2" value="5">
                        <label class="form-check-label" for="place2">⛰️ 팔공산</label>
                    </div>
                    <div class="form-check">
                        <input class="form-check-input" type="radio" name="place_id" id="place3" value="6">
                        <label class="form-check-label" for="place3">⛰️ 황악산</label>
                    </div>
                </div>

                <!-- 제출 버튼 (id 추가됨) -->
                <div class="d-grid gap-2">
                    <button type="submit" id="submitBtn" class="btn btn-primary btn-lg py-3 rounded-pill shadow">
                        투표 완료하기 ✨
                    </button>
                    <a href="results.php" class="btn btn-outline-secondary btn-sm mt-2">결과만 보기</a>
                </div>

            </form>
        </div>
    </div>
</div>

</body>
</html>

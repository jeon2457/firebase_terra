<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>샘플 동영상 보기</title>
  
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #1a1a1a; /* 어두운 배경 */
      color: #ffffff;
      font-family: 'Noto Sans KR', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
    }

    .container {
      width: 90%;
      max-width: 600px;
      background: #2c2c2c;
      padding: 20px;
      border-radius: 15px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    h2 {
      margin-bottom: 20px;
      font-size: 1.5rem;
      color: #4facfe;
    }

    /* 비디오 플레이어 스타일 */
    video {
      width: 100%;
      height: auto;
      border-radius: 10px;
      background: #000;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }

    /* 다운로드 버튼 스타일 */
    .btn-download {
      display: inline-block;
      margin-top: 25px;
      padding: 15px 30px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      text-decoration: none;
      font-weight: bold;
      border-radius: 50px;
      box-shadow: 0 4px 15px rgba(118, 75, 162, 0.4);
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .btn-download:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(118, 75, 162, 0.6);
    }

    .btn-download:active {
      transform: scale(0.98);
    }

    .info-text {
      margin-top: 10px;
      font-size: 0.8rem;
      color: #aaa;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- <h2>🎬 샘플 동영상 확인</h2> -->

    <!-- 1. 동영상 바로 보기 (플레이어) -->
    <!-- 
         controls: 재생바 표시
         autoplay: 자동 재생
         muted: 음소거 (모바일/크롬에서 자동재생되려면 필수)
         playsinline: 아이폰에서 전체화면 안 되고 바로 재생
    -->
    <video controls autoplay muted playsinline id="sampleVideo">
      <source src="movie/tel_view_sample.mp4" type="video/mp4">
      브라우저가 비디오 태그를 지원하지 않습니다.
    </video>

    

    <!-- 2. 다운로드 버튼 -->
    <a href="movie/tel_view_sample.mp4" download class="btn-download">
      📥 동영상 다운로드 받기
    </a>
  </div>

</body>
</html>
